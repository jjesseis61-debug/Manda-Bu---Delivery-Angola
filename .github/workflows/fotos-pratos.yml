# Procura fotos de licença livre para os pratos (Wikimedia Commons) e grava as candidatas no ramo,
# para serem escolhidas antes de irem para o bucket `fotos-pratos`.
name: Fotos dos pratos

on:
  push:
    branches: ['claude/**']
    paths: ['docs/fotos-pratos/pesquisa.json', 'scripts/procurar_fotos.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/procurar_fotos.py
      - name: Gravar as candidatas no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fotos-pratos/candidatos
          git diff --cached --quiet || git commit -m "Fotos candidatas dos pratos (Wikimedia Commons)"
          git push
