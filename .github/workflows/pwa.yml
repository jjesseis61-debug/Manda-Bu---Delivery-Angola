# PWA da app do CLIENTE no Netlify (site "manda-bue"), publicada automaticamente pelo GitHub.
# Serve em vez de ligar o repositório no painel do Netlify: a cada push que mexa na app do cliente
# (ou na configuração do Netlify) compila o Expo web e publica em produção.
# Precisa de UM segredo no GitHub: NETLIFY_AUTH_TOKEN (token pessoal do Netlify, em
# User settings → Applications → Personal access tokens). Sem o segredo, o job avisa e não falha.
# O id do site não é segredo (é o identificador público do projecto no Netlify).
name: PWA cliente (Netlify)

on:
  push:
    branches: [claude/projeto-crescimento-fase-i1-gy5bul]
    paths:
      - 'apps/cliente/**'
      - 'netlify.toml'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

concurrency:
  group: pwa-netlify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar a PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NETLIFY_SITE_ID: 076aa484-4c0b-4e82-9af8-0bb62c5f891d
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Há token do Netlify?
        id: token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Falta o segredo NETLIFY_AUTH_TOKEN (Settings → Secrets and variables → Actions). A PWA não foi publicada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cliente/package-lock.json
      - name: Dependências da app do cliente
        if: steps.token.outputs.ok == 'true'
        working-directory: apps/cliente
        run: npm ci
      - name: Compilar e publicar (base apps/cliente, build web e edge function /p/*, do netlify.toml)
        if: steps.token.outputs.ok == 'true'
        # Usa as variáveis públicas de [build.environment] do netlify.toml, como no build do Netlify.
        run: |
          for tentativa in 1 2 3; do
            npx --yes netlify-cli@17 deploy --build --prod --site "$NETLIFY_SITE_ID" \
              --message "GitHub ${GITHUB_SHA::7}" && exit 0
            echo "::warning::Publicação falhou (tentativa $tentativa); a repetir em 30s..."
            sleep 30
          done
          exit 1
